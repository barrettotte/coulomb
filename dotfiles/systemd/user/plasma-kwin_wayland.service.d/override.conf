[Service]
# Pin the 3090 Ti (PCI 0d:00.0) as KWin's primary render device. Otherwise
# KWin picks the lower-PCI card and 3090 Ti scanout breaks under
# cross-vendor PRIME.
#
# Must use by-path/ symlinks (not hardcoded /dev/dri/cardN): VFIO release
# on the AMD card produces a new cardN minor (e.g. card1 -> card3); kwin
# canonicalizes m_explicitGpus entries via QFileInfo::canonicalFilePath()
# at event time, so by-path symlinks re-resolve to the current cardN per
# event. Hardcoded cardN would filter out post-VFIO events; secondary GPU
# never re-attaches.
#
# Colons in PCI addresses must be escaped — but for systemd unit Environment=
# the escape is DOUBLE backslash (\\). systemd's parser converts \\ -> \ when
# loading the unit, so the spawned process sees \: in its env, which kwin's
# splitPathList (drm_backend.cpp ~line 54) parses as a literal colon (part
# of a path) vs. an unescaped colon as the path-list delimiter.
#
# WARNING: single backslash (\:) is rejected by the systemd unit parser,
# manifesting as: `systemctl show -p Environment` returns empty, kwin starts
# with no DRM allowlist, "No suitable DRM devices have been found", session
# fails. Always use double backslash here.
Environment=KWIN_DRM_DEVICES=/dev/dri/by-path/pci-0000\\:0d\\:00.0-card:/dev/dri/by-path/pci-0000\\:07\\:00.0-card
