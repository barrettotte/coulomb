DBX_CONTAINER_HOME_PREFIX="/var/mnt/code/distrobox"

# Auto-install the GPU pinning profile.d script into every new container so
# GUI apps don't crash when the Win10 VM hooks unbind amdgpu. Idempotent —
# safe to re-run via `distrobox create --init-hooks`. Symlink so dotfile
# edits propagate without recreating containers.
container_init_hook="sudo ln -sf /home/barrett/repos/coulomb/dotfiles/distrobox/profile.d/coulomb-gpu-pin.sh /etc/profile.d/coulomb-gpu-pin.sh"

