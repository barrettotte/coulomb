SCB_AUTO_RES=1
SCB_GAMESCOPE_ARGS="-f --rt --grab --force-grab-cursor --backend wayland --prefer-vk-device 10de:2203"

# Pin scopebuddy-wrapped games to RTX 3090 Ti (PCI 10de:2203).
# Each variable covers a different Vulkan client:
#   MESA_VK_DEVICE_SELECT      — native Vulkan (Mesa device-select layer over NVIDIA ICD)
#   DXVK_FILTER_DEVICE_NAME    — DXVK (DX9 / DX10 / DX11)
#   VKD3D_FILTER_DEVICE_NAME   — VKD3D-Proton (DX12)
export MESA_VK_DEVICE_SELECT="10de:2203"
export MESA_VK_DEVICE_SELECT_FORCE_DEFAULT_DEVICE=1
export DXVK_FILTER_DEVICE_NAME="RTX 3090"
export VKD3D_FILTER_DEVICE_NAME="RTX 3090"
