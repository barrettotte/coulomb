---

- name: Bazzite Host Setup
  hosts: localhost
  connection: local

  vars:
    coulomb_dir: "{{ ansible_facts['env']['HOME'] }}/storage/code/repos/coulomb"
    dotfiles_dir: "{{ coulomb_dir }}/dotfiles"
    brew_prefix: /home/linuxbrew/.linuxbrew

  tasks:
    # ====================================================
    # Verify Mounts
    # ====================================================

    - name: Verify required mounts
      ansible.builtin.stat:
        path: "{{ item }}"
      register: mount_checks
      loop:
        - /var/mnt/code
        - /var/mnt/mass
        - /var/mnt/misc
        - "{{ ansible_facts['env']['HOME'] }}/storage"

    - name: Fail if mounts are missing
      ansible.builtin.fail:
        msg: >
          Required mount {{ item.item }} is missing.
          See bazzite.md for mount setup instructions.
      when: not item.stat.exists
      loop: "{{ mount_checks.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ====================================================
    # Homebrew Packages
    # ====================================================

    - name: Install Homebrew packages
      community.general.homebrew:
        name:
          - htop
          - fastfetch
          - feh
          - neovim
          - git-lfs
          - git-crypt
          - jq
          - claude-code
          - p7zip
          - yt-dlp
        state: present

    # ====================================================
    # rpm-ostree Layered Packages
    # ====================================================

    # zsh is layered via rpm-ostree (not brew) so the login shell
    # stays available even if user services / homebrew env have issues.

    - name: Check rpm-ostree layered packages
      ansible.builtin.command: rpm-ostree status --json
      register: ostree_status
      changed_when: false

    - name: Layer zsh via rpm-ostree
      ansible.builtin.command: rpm-ostree install --idempotent --assumeyes zsh
      become: true
      when: "'zsh' not in (ostree_status.stdout | from_json).deployments[0]['requested-packages'] | default([])"
      register: zsh_layered

    - name: Notify reboot required if zsh was just layered
      ansible.builtin.debug:
        msg: "zsh was layered via rpm-ostree — reboot required before it becomes available at /usr/bin/zsh"
      when: zsh_layered.changed

    # libvirt + QEMU + virt-install + UEFI firmware are layered for the
    # win10 GPU-passthrough VM (see vms/windows-10/setup.md). The bazzite-nvidia
    # image F43 included libvirt's modular daemons (virtqemud/virtstoraged/
    # virtnetworkd) in the base image; F44 (~2026-04-30) dropped them. Layering
    # explicitly makes us immune to that recurring.

    - name: Layer libvirt + QEMU stack via rpm-ostree
      ansible.builtin.command: >
        rpm-ostree install --idempotent --assumeyes
        libvirt qemu-kvm virt-install edk2-ovmf
      become: true
      when: "'libvirt' not in (ostree_status.stdout | from_json).deployments[0]['requested-packages'] | default([])"
      register: libvirt_layered

    - name: Notify reboot required if libvirt was just layered
      ansible.builtin.debug:
        msg: "libvirt+qemu was layered via rpm-ostree — reboot required, then re-run init.sh to finish enabling daemons"
      when: libvirt_layered.changed

    # dkms (Dynamic Kernel Module Support) is layered for third-party
    # out-of-tree kernel modules that need to survive kernel updates.
    - name: Layer dkms via rpm-ostree
      ansible.builtin.command: rpm-ostree install --idempotent --assumeyes dkms
      become: true
      when: "'dkms' not in (ostree_status.stdout | from_json).deployments[0]['requested-packages'] | default([])"
      register: dkms_layered

    - name: Notify reboot required if dkms was just layered
      ansible.builtin.debug:
        msg: "dkms was layered via rpm-ostree — reboot required before `dkms` is available on PATH"
      when: dkms_layered.changed

    # ====================================================
    # Oh My Zsh + Plugins
    # ====================================================

    - name: Check if Oh My Zsh is installed
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh"
      register: omz_dir

    - name: Install Oh My Zsh
      ansible.builtin.shell: >
        sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
      when: not omz_dir.stat.exists

    - name: Install zsh-autosuggestions plugin
      ansible.builtin.git:
        repo: https://github.com/zsh-users/zsh-autosuggestions
        dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
        depth: 1
      when: omz_dir.stat.exists or not omz_dir.stat.exists

    - name: Install zsh-syntax-highlighting plugin
      ansible.builtin.git:
        repo: https://github.com/zsh-users/zsh-syntax-highlighting
        dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
        depth: 1
      when: omz_dir.stat.exists or not omz_dir.stat.exists

    - name: Set zsh as default shell
      ansible.builtin.user:
        name: "{{ ansible_facts['env']['USER'] }}"
        shell: /usr/bin/zsh
      become: true
      when: ansible_facts['env']['USER'] is defined and (zsh_layered is not defined or not zsh_layered.changed)

    # ====================================================
    # Directories
    # ====================================================

    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ ansible_facts['env']['HOME'] }}/storage/code/distrobox"
        - "{{ ansible_facts['env']['HOME'] }}/storage/code/podman"
        - "{{ ansible_facts['env']['HOME'] }}/.config/containers"
        - "{{ ansible_facts['env']['HOME'] }}/.config/distrobox"
        - "{{ ansible_facts['env']['HOME'] }}/.config/nvim"
        - "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        - "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts"
        - "{{ ansible_facts['env']['HOME'] }}/.config/coulomb"
        - "{{ ansible_facts['env']['HOME'] }}/.config/autostart"
        - "{{ ansible_facts['env']['HOME'] }}/.config/scopebuddy"
        - "{{ ansible_facts['env']['HOME'] }}/.config/discord-rpc-bridge"
        - "{{ ansible_facts['env']['HOME'] }}/.local/share/applications"
        - "{{ ansible_facts['env']['HOME'] }}/.local/share/konsole"
        - "{{ ansible_facts['env']['HOME'] }}/storage/code/vms"

    # ====================================================
    # Symlink Dotfiles
    # ====================================================

    - name: Symlink dotfiles
      ansible.builtin.file:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        state: link
        force: true
      loop:
        - src: "{{ dotfiles_dir }}/.zshrc"
          dest: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
        - src: "{{ dotfiles_dir }}/.gitconfig"
          dest: "{{ ansible_facts['env']['HOME'] }}/.gitconfig"
        - src: "{{ dotfiles_dir }}/.tmux.conf"
          dest: "{{ ansible_facts['env']['HOME'] }}/.tmux.conf"
        - src: "{{ dotfiles_dir }}/podman/storage.conf"
          dest: "{{ ansible_facts['env']['HOME'] }}/.config/containers/storage.conf"
        - src: "{{ dotfiles_dir }}/distrobox/distrobox.conf"
          dest: "{{ ansible_facts['env']['HOME'] }}/.config/distrobox/distrobox.conf"
        - src: "{{ dotfiles_dir }}/nvim"
          dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim"
        - src: "{{ dotfiles_dir }}/autostart/opentabletdriver-kwin-map.desktop"
          dest: "{{ ansible_facts['env']['HOME'] }}/.config/autostart/opentabletdriver-kwin-map.desktop"
        - src: "{{ dotfiles_dir }}/autostart/opendeck.desktop"
          dest: "{{ ansible_facts['env']['HOME'] }}/.config/autostart/opendeck.desktop"
        - src: "{{ dotfiles_dir }}/scopebuddy/scb.conf"
          dest: "{{ ansible_facts['env']['HOME'] }}/.config/scopebuddy/scb.conf"
        - src: "{{ dotfiles_dir }}/discord-rpc-bridge/config.json"
          dest: "{{ ansible_facts['env']['HOME'] }}/.config/discord-rpc-bridge/config.json"
        - src: "{{ dotfiles_dir }}/flatpak/overrides/org.virt_manager.virt-manager"
          dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/flatpak/overrides/org.virt_manager.virt-manager"
        - src: "{{ dotfiles_dir }}/flatpak/overrides/com.discordapp.Discord"
          dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/flatpak/overrides/com.discordapp.Discord"
        - src: "{{ dotfiles_dir }}/flatpak/overrides/com.brave.Browser"
          dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/flatpak/overrides/com.brave.Browser"
        - src: "{{ dotfiles_dir }}/flatpak/config/com.brave.Browser/brave-flags.conf"
          dest: "{{ ansible_facts['env']['HOME'] }}/.var/app/com.brave.Browser/config/brave-flags.conf"
        - src: "{{ dotfiles_dir }}/systemd/user/plasma-kwin_wayland.service.d"
          dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/plasma-kwin_wayland.service.d"
        - src: "{{ dotfiles_dir }}/systemd/user/discord-graceful-quit.service"
          dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/discord-graceful-quit.service"
        # Override the system steam.desktop so launches go through coulomb-steam-launcher,
        # which pins the RTX 3090 Ti (Vulkan/DXVK/VKD3D).
        - src: "{{ dotfiles_dir }}/applications/steam.desktop"
          dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/applications/steam.desktop"
        - src: "{{ dotfiles_dir }}/konsole/Main.profile"
          dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/konsole/Main.profile"
        - src: "{{ dotfiles_dir }}/konsole/VaporOpaque.colorscheme"
          dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/konsole/VaporOpaque.colorscheme"

    # ====================================================
    # JetBrainsMono Nerd Font
    # ====================================================

    - name: Check if JetBrainsMono font is installed
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts/JetBrainsMono"
      register: jbm_font

    - name: Get latest JetBrainsMono Nerd Font release URL
      ansible.builtin.uri:
        url: https://api.github.com/repos/ryanoasis/nerd-fonts/releases/latest
        return_content: true
      register: nf_release
      when: not jbm_font.stat.exists

    - name: Download JetBrainsMono Nerd Font
      ansible.builtin.get_url:
        url: "{{ nf_release.json.assets | selectattr('name', 'equalto', 'JetBrainsMono.zip') | map(attribute='browser_download_url') | first }}"
        dest: /tmp/JetBrainsMono.zip
        mode: "0644"
      when: not jbm_font.stat.exists

    - name: Create JetBrainsMono font directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts/JetBrainsMono"
        state: directory
        mode: "0755"
      when: not jbm_font.stat.exists

    - name: Extract JetBrainsMono Nerd Font
      ansible.builtin.unarchive:
        src: /tmp/JetBrainsMono.zip
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts/JetBrainsMono"
        remote_src: true
      when: not jbm_font.stat.exists

    - name: Refresh font cache
      ansible.builtin.command: fc-cache -fv
      changed_when: true
      when: not jbm_font.stat.exists

    - name: Clean up font zip
      ansible.builtin.file:
        path: /tmp/JetBrainsMono.zip
        state: absent
      when: not jbm_font.stat.exists

    # ====================================================
    # Services and Groups
    # ====================================================

    # libvirt's modular daemons are the Fedora default; libvirtd is legacy
    # and disabled-by-preset. virt-manager (flatpak'd) and virsh both reach
    # /run/libvirt/virtqemud-sock via socket activation, so enabling the
    # sockets is enough — the daemons start on first connection. On the
    # first run after layering libvirt the units don't exist yet; gate on
    # virtqemud.socket and skip cleanly until reboot.

    - name: Check for modular libvirt daemon
      ansible.builtin.stat:
        path: /usr/lib/systemd/system/virtqemud.socket
      register: virtqemud_unit

    - name: Enable libvirt modular sockets
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      become: true
      loop:
        - virtqemud.socket       # QEMU domain management
        - virtstoraged.socket    # storage pools
        - virtnetworkd.socket    # virtual networks
        - virtnodedevd.socket    # host PCI/USB enumeration (passthrough)
      when: virtqemud_unit.stat.exists

    # ====================================================
    # Virtualization (QEMU/KVM)
    # ====================================================

    - name: Set KVM kernel args
      ansible.builtin.command: rpm-ostree kargs --append-if-missing="kvm.ignore_msrs=1" --append-if-missing="kvm.report_ignored_msrs=0"
      register: kvm_kargs
      changed_when: "'Staging' in kvm_kargs.stdout"

    # AMD RDNA3 (Navi 33 RX 7600 here) doesn't fully reset when vfio-pci
    # releases the device, which breaks amdgpu's re-probe path with an
    # -EEXIST on stale sysfs entries (mem_info_preempt_used etc.). runpm=0
    # prevents D3cold transitions that confuse re-probe; reset_method=3
    # (mode2) is the soft reset RDNA3 actually implements cleanly. These
    # reduce the upstream state corruption that exposes the leak; the
    # vfio-navi-livepatch bundle handles the kernel NULL-derefs that
    # would otherwise oops the host on VM shutdown / rebind:
    #   https://github.com/barrettotte/vfio-navi-livepatch
    - name: Set amdgpu kernel args for VFIO passthrough rebind (RDNA3 workaround)
      ansible.builtin.command: rpm-ostree kargs --append-if-missing="amdgpu.runpm=0" --append-if-missing="amdgpu.reset_method=3"
      register: amdgpu_kargs
      changed_when: "'Staging' in amdgpu_kargs.stdout"

    - name: Create swtpm directory
      ansible.builtin.file:
        path: /var/lib/swtpm-localca
        state: directory
        owner: tss
        mode: "0755"
      become: true

    - name: Restore SELinux contexts on libvirt directories
      ansible.builtin.command: restorecon -rv {{ item }}
      loop:
        - /var/lib/libvirt
        - /var/log/libvirt
      become: true
      register: restorecon_result
      changed_when: restorecon_result.stdout | length > 0

    - name: Check qemu ACL on home directory
      ansible.builtin.command: getfacl -c {{ ansible_facts['env']['HOME'] }}
      register: home_acl
      changed_when: false

    - name: Grant qemu user access to home directory for ISOs
      ansible.builtin.command: setfacl -m u:qemu:rx {{ ansible_facts['env']['HOME'] }}
      become: true
      when: "'user:qemu:r-x' not in home_acl.stdout"

    # libvirt qemu hooks: per-VM dispatcher + win10 GPU passthrough scripts.
    # Owned by this playbook rather than the standalone hooks/install.sh so
    # re-running host-setup doesn't drift. Switched away from the upstream
    # PassthroughPOST dispatcher because the win10 attach/return scripts
    # need a simpler dispatcher contract (stdin XML, only prepare/begin
    # and release/end branches) — see vms/windows-10/hooks/qemu.

    - name: Create libvirt hooks directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/libvirt/hooks
        - /etc/libvirt/hooks/qemu.d
        - /etc/libvirt/hooks/qemu.d/win10/prepare/begin
        - /etc/libvirt/hooks/qemu.d/win10/release/end
      become: true

    - name: Install libvirt qemu hook dispatcher
      ansible.builtin.copy:
        src: "{{ coulomb_dir }}/vms/windows-10/hooks/qemu"
        dest: /etc/libvirt/hooks/qemu
        mode: "0755"
        remote_src: true
      become: true
      register: qemu_hook

    - name: Install win10 GPU passthrough hook scripts
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "0755"
        remote_src: true
      loop:
        - src: "{{ coulomb_dir }}/vms/windows-10/hooks/qemu.d/win10/prepare/begin/10-gpu-attach.sh"
          dest: /etc/libvirt/hooks/qemu.d/win10/prepare/begin/10-gpu-attach.sh
        - src: "{{ coulomb_dir }}/vms/windows-10/hooks/qemu.d/win10/release/end/10-gpu-return.sh"
          dest: /etc/libvirt/hooks/qemu.d/win10/release/end/10-gpu-return.sh
      become: true
      register: win10_hooks

    - name: Restart virtqemud when hooks change
      ansible.builtin.systemd:
        name: virtqemud.service
        state: restarted
      become: true
      when:
        - virtqemud_unit.stat.exists
        - qemu_hook.changed or win10_hooks.changed

    - name: Enable and start podman socket (user)
      ansible.builtin.systemd:
        name: podman.socket
        enabled: true
        state: started
        scope: user

    # ====================================================
    # OpenTabletDriver (XP-Pen Artist 15.6 Pro)
    # ====================================================
    # OTD Artist Mode handles pen input/pressure. Kernel hid_uclogic
    # driver is blacklisted to avoid conflicts. KWin display mapping
    # is handled by opentabletdriver-kwin-map autostart script.
    #
    # After reboot:
    #   1. Open OTD GUI, set Output to Artist Mode
    #   2. Set display area to full virtual desktop (KWin handles monitor mapping)
    #   3. Clear tip binding (Pen Settings > Tip > ... > Clear)

    - name: Download OpenTabletDriver release tarball
      ansible.builtin.shell: |
        curl -s https://api.github.com/repos/OpenTabletDriver/OpenTabletDriver/releases/latest \
        | jq -r '.assets | sort_by(.created_at) | .[] | select(.name|test("opentabletdriver.*tar.gz$")) | .browser_download_url' \
        | wget -qi - -O /tmp/opentabletdriver.tar.gz
      args:
        creates: /etc/udev/rules.d/71-opentabletdriver.rules

    - name: Extract OpenTabletDriver udev rules
      ansible.builtin.shell: |
        mkdir -p /tmp/OpenTabletDriver
        tar --strip-components=1 -xzf /tmp/opentabletdriver.tar.gz -C /tmp/OpenTabletDriver
        cp /tmp/OpenTabletDriver/etc/udev/rules.d/70-opentabletdriver.rules /etc/udev/rules.d/71-opentabletdriver.rules
        rm -rf /tmp/OpenTabletDriver /tmp/opentabletdriver.tar.gz
      args:
        creates: /etc/udev/rules.d/71-opentabletdriver.rules
      become: true

    - name: Install OpenTabletDriver flatpak
      community.general.flatpak:
        name: net.opentabletdriver.OpenTabletDriver
        state: present
        method: system

    - name: Create OpenTabletDriver config directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/OpenTabletDriver"
        state: directory
        mode: "0755"

    - name: Set OpenTabletDriver flatpak override
      ansible.builtin.command: flatpak override --user --filesystem=xdg-config/OpenTabletDriver net.opentabletdriver.OpenTabletDriver
      changed_when: false

    - name: Create systemd user directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user"
        state: directory
        mode: "0755"

    - name: Install OpenTabletDriver systemd user service
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/flathub/net.opentabletdriver.OpenTabletDriver/refs/heads/master/scripts/opentabletdriver.service
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/opentabletdriver.service"
        mode: "0644"

    - name: Enable OpenTabletDriver user service
      ansible.builtin.systemd:
        name: opentabletdriver.service
        enabled: true
        state: started
        scope: user

    - name: Blacklist kernel tablet drivers for OpenTabletDriver
      ansible.builtin.command: rpm-ostree kargs --append-if-missing="modprobe.blacklist=hid_uclogic" --append-if-missing="modprobe.blacklist=wacom"
      register: tablet_kargs
      changed_when: "'Staging' in tablet_kargs.stdout"

    # ====================================================
    # Elgato Stream Deck (OpenDeck)
    # ====================================================

    - name: Install Stream Deck udev rules
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/OpenActionAPI/rust-elgato-streamdeck/main/40-streamdeck.rules
        dest: /etc/udev/rules.d/40-streamdeck.rules
        mode: "0644"
      become: true
      register: streamdeck_udev

    - name: Reload udev rules for Stream Deck
      ansible.builtin.command: udevadm control --reload-rules
      become: true
      when: streamdeck_udev.changed

    # ====================================================
    # RTL-SDR
    # ====================================================

    - name: Blacklist DVB kernel module for RTL-SDR
      ansible.builtin.copy:
        dest: /etc/modprobe.d/blacklist-rtlsdr.conf
        content: |
          # Prevent kernel TV tuner driver from claiming RTL-SDR devices
          blacklist dvb_usb_rtl28xxu
          blacklist rtl2832
          blacklist rtl2830
        mode: "0644"
      become: true

    - name: Install RTL-SDR udev rules
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/20-rtlsdr.rules
        content: |
          # RTL-SDR - allow non-root access
          SUBSYSTEM=="usb", ATTRS{idVendor}=="0bda", ATTRS{idProduct}=="2838", MODE="0666"
          SUBSYSTEM=="usb", ATTRS{idVendor}=="0bda", ATTRS{idProduct}=="2832", MODE="0666"
        mode: "0644"
      become: true
      register: rtlsdr_udev

    - name: Reload udev rules
      ansible.builtin.command: udevadm control --reload-rules
      become: true
      when: rtlsdr_udev.changed

    - name: Install discord-rpc-bridge
      ansible.builtin.shell: |
        curl -fsSL https://raw.githubusercontent.com/barrettotte/discord-rpc-bridge/master/scripts/download.sh | bash
      args:
        creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/discord-rpc-bridge"

    # Forces graceful Discord shutdown at session logout so Electron flushes
    # leveldb before SIGKILL -- otherwise the auth token is lost and Discord
    # requires a fresh login on every relogin. Symlink is created by the
    # "Symlink dotfiles" task above; enable wires it into the session target.
    - name: Enable discord-graceful-quit user service
      ansible.builtin.systemd:
        name: discord-graceful-quit.service
        enabled: true
        scope: user
        daemon_reload: true

    - name: Check if Daedalus flatpak is installed
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/share/flatpak/app/com.github.barrettotte.daedalus"
      register: daedalus_installed

    - name: Get latest Daedalus release URL
      ansible.builtin.uri:
        url: https://api.github.com/repos/barrettotte/daedalus/releases/latest
        return_content: true
      register: daedalus_release
      when: not daedalus_installed.stat.exists

    - name: Install Daedalus flatpak
      ansible.builtin.shell: |
        curl -fsSL -o /tmp/daedalus.flatpak '{{ daedalus_release.json.assets | selectattr("name", "equalto", "daedalus-linux-amd64.flatpak") | map(attribute="browser_download_url") | first }}'
        flatpak install --user --noninteractive /tmp/daedalus.flatpak
        rm -f /tmp/daedalus.flatpak
      when: not daedalus_installed.stat.exists
