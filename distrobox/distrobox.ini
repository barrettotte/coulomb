# Coulomb distrobox manifest. Each entry references a locally-built image
# (see ./build.sh and <box>/Containerfile).
#
# Build images first, then create containers:
#   ./build.sh                                                 # build all
#   distrobox assemble create --file distrobox.ini             # create all
#
# Container homes live outside $HOME via DBX_CONTAINER_HOME_PREFIX
# (set in ~/.config/distrobox/distrobox.conf -> dotfiles/distrobox/distrobox.conf).
#
# init_hooks run as user 1000 via `sudo -u \#1000 bash ...` so the per-user
# init scripts don't execute as root.

# Main development box
[dev-box]
image=localhost/coulomb-dev-box:latest
pull=false
root=false
entry=false
nvidia=true
volume=/run/user/1000/podman/podman.sock:/var/run/docker.sock
init_hooks="sudo -u \#1000 bash ${HOME}/repos/coulomb/distrobox/dev-box/init.sh"
exported_apps=code
exported_bins=/usr/bin/code

# CTF environment
[ctf-box]
image=localhost/coulomb-ctf-box:latest
pull=false
root=false
entry=false
volume=/run/user/1000/podman/podman.sock:/var/run/docker.sock
init_hooks="sudo -u \#1000 bash ${HOME}/repos/coulomb/distrobox/ctf-box/init.sh"
exported_apps=ghidra burpsuite wireshark
exported_bins=/usr/bin/ghidra /usr/bin/burpsuite /usr/bin/wireshark

# FPGA and embedded development
[embed-box]
image=localhost/coulomb-embed-box:latest
pull=false
root=false
entry=false
init_hooks="sudo -u \#1000 bash ${HOME}/repos/coulomb/distrobox/embed-box/init.sh"
exported_apps=pulseview gtkwave
exported_bins=/usr/bin/pulseview /usr/bin/gtkwave

# Game development
[gamedev-box]
image=localhost/coulomb-gamedev-box:latest
pull=false
root=false
entry=false
nvidia=true
init_hooks="sudo -u \#1000 bash ${HOME}/repos/coulomb/distrobox/gamedev-box/init.sh"

# SDR and GNU Radio
[radio-box]
image=localhost/coulomb-radio-box:latest
pull=false
root=false
entry=false
init_hooks="sudo -u \#1000 bash ${HOME}/repos/coulomb/distrobox/radio-box/init.sh"
exported_apps=sdrpp gnuradio-companion gpredict fldigi
exported_bins=/usr/bin/gqrx /usr/bin/sdrpp /usr/bin/gnuradio-companion /usr/bin/gpredict /usr/bin/fldigi /usr/bin/inspectrum
